spec:
  name: rural-sustainability-broadcast
  regions:
    - fra
  instance_types:
    - free
  ports:
    - port: 8000
      protocol: http
  routes:
    - path: /
      port: 8000
  env:
    - key: CWA_API_KEY
      value: ""
    - key: TARGET_COUNTY
      value: "臺中市"
    - key: TARGET_TOWN
      value: "東勢區"
    - key: PRESET_MARKET_CODES
      value: "423,400,420"
    - key: PREF_TRUST_PROXY
      value: "1"
    - key: TTS_ENGINE
      value: "voxhakka_space"
    - key: TTS_SPACE
      value: "united-link/taiwanese-hakka-tts"
    - key: TTS_MODEL
      value: "yourtts-htia-240704"
    - key: TTS_DIALECT
      value: "dapu"
    - key: TTS_SPEAKER
      value: "宋涵葳"
    - key: TTS_TIMEOUT_SECONDS
      value: "900"
  service:
    type: docker
    source:
      type: git
      repository: ZYZ17/rural-sustainability-broadcast
      branch: main
    docker:
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir backend
